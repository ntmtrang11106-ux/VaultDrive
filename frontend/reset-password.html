<!-- Khai báo chuẩn tài liệu HTML5 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultDrive - Đặt lại mật khẩu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.1325 20.176 10.2077 17.8596 10.0116C17.4326 6.64368 14.5683 4 11 4C7.13401 4 4 7.13401 4 11C4 11.2372 4.01174 11.4716 4.03454 11.7027C2.29063 12.1818 1 13.784 1 15.6667C1 17.8758 2.79086 19.6667 5 19.6667H17.5Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <h1>VaultDrive</h1>
                        <p>ĐẶT LẠI MẬT KHẨU</p>
                    </div>
                </div>
            </div>
            
            <form id="resetPasswordForm" class="auth-form" novalidate>
                <div class="form-group" style="text-align: center; margin-bottom: 25px;">
                    <p style="font-size: 14px; color: var(--text-muted); line-height: 1.5;">Vui lòng nhập mật khẩu mới. Đảm bảo mật khẩu của bạn an toàn và đủ mạnh.</p>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu mới</label>
                    <input type="password" id="password" name="password" required placeholder="Tạo mật khẩu mới">
                    <span class="field-error" id="passwordError"></span>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Xác nhận lại mật khẩu mới">
                    <span class="field-error" id="confirmPasswordError"></span>
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
                
                <button type="submit" class="btn-primary" id="resetBtn">
                    <span>Xác nhận Đổi mật khẩu</span>
                    <div class="loader" id="resetLoader"></div>
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="login.html">Quay lại Đăng nhập</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
