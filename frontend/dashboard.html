<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang chủ - VaultDrive</title>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <!-- Nơi layout.js sẽ chèn Sidebar vào -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Nơi layout.js sẽ chèn Header vào -->
      <div id="header-container"></div>

      <!-- Content Area -->
      <div class="content-scroll">
        <!-- Folders Section -->
        <div class="section-title">THƯ MỤC</div>
        <div class="grid-folders">
          <!-- Dữ liệu mẫu (sẽ bị ghi đè bởi dashboard.js) -->
          <div class="folder-card">
            <i class="ph-fill ph-folder folder-icon blue"></i>
            <div class="folder-name">Thiết kế sản phẩm</div>
            <div class="folder-meta">Hôm nay</div>
          </div>
        </div>

        <!-- Files Section -->
        <div class="section-title">TỆP TIN</div>
        <div class="grid-files">
          <!-- Dữ liệu mẫu (sẽ bị ghi đè bởi dashboard.js) -->
          <div class="file-card">
            <div class="file-icon-box file-pdf">
              <i class="ph-fill ph-file-pdf"></i>
            </div>
            <div class="file-name">Báo cáo tài chính Q3.pdf</div>
            <div class="file-meta">15/08 &middot; 4,2 MB</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Upload Status Floating Widget -->
    <div class="upload-status">
      <div class="upload-progress-circle">
        <svg viewBox="0 0 36 36">
          <circle class="bg" cx="18" cy="18" r="16"></circle>
          <circle class="progress" cx="18" cy="18" r="16"></circle>
        </svg>
        <div class="percent">65%</div>
      </div>
      <div class="upload-info">
        <div class="upload-title">Đang tải 1 tệp</div>
        <div class="upload-subtitle">0 hoàn thành &middot; Nhấn để xem</div>
      </div>
      <div class="upload-action">
        <i class="ph ph-caret-down"></i>
      </div>
    </div>

    <!-- Help Button -->
    <div class="help-btn">
      <i class="ph ph-question"></i>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
