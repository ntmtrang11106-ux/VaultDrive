<!-- Thanh tiêu đề Thùng rác: Thông tin tổng quan bên trái + Nút Xóa/Khôi phục theo lô bên phải -->
<div class="trash-header-row" id="trash-header-row">
  <div class="trash-header-info" id="trash-header-info">
  </div>
  <div class="trash-header-actions" id="trash-header-actions">
    <button type="button" class="btn-trash-batch-restore" id="btnBatchRestore" style="display: none;" onclick="restoreSelectedTrashItems()">
      <i class="ph-bold ph-arrow-counter-clockwise"></i>
      <span class="btn-text">Khôi phục</span>
    </button>
    <button type="button" class="btn-trash-batch-delete disabled" id="btnBatchDelete" onclick="deleteSelectedTrashItems()">
      <i class="ph-bold ph-trash"></i>
      <span class="btn-text">Xóa</span>
    </button>
  </div>
</div>
<div class="trash-list" id="trash-list">
</div>

<!-- Template cho thư mục trong thùng rác -->
<template id="trash-folder-template">
  <div class="trash-item">
    <div class="trash-checkbox" onclick="toggleTrashSelection(this, event)"></div>
    <div class="trash-icon-box blue">
      <i class="ph-fill ph-folder"></i>
    </div>
    <div class="trash-item-info">
      <div class="trash-item-name"></div>
      <div class="trash-item-meta"></div>
    </div>
    <span class="days-left"></span>
    <div class="trash-actions">
      <button class="btn-restore">Khôi phục</button>
      <button class="btn-delete">Xóa</button>
    </div>
  </div>
</template>

<!-- Template cho file trong thùng rác -->
<template id="trash-file-template">
  <div class="trash-item">
    <div class="trash-checkbox" onclick="toggleTrashSelection(this, event)"></div>
    <div class="trash-icon-box">
      <!-- Icon sẽ được JS chèn vào -->
    </div>
    <div class="trash-item-info">
      <div class="trash-item-name"></div>
      <div class="trash-item-meta"></div>
    </div>
    <span class="days-left"></span>
    <div class="trash-actions">
      <button class="btn-restore">Khôi phục</button>
      <button class="btn-delete">Xóa</button>
    </div>
  </div>
</template>

<!-- Trạng thái rỗng: hiện khi thùng rác không có gì -->
<div class="trash-empty-state" id="trash-empty-state" style="display: none;">
  <i class="ph ph-trash"></i>
  <h3>Thùng rác trống</h3>
  <p>Các mục trong thùng rác sẽ bị xóa vĩnh viễn sau 30 ngày.</p>
</div>
