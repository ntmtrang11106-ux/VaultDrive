events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 500M;

    # Ẩn phiên bản Nginx trên Header để chống dò quét lỗ hổng (Banner Grabbing)
    server_tokens off;

    # DNS nội bộ của Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ==========================================================
    # TƯỜNG LỬA LỚP 1: NGINX RATE LIMITING & DDOS PROTECTION
    # ==========================================================
    # 1. Giới hạn chung cho API: 10 req/giây trên mỗi IP (Bộ nhớ 10MB lưu được ~160.000 IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Giới hạn gắt cho Đăng nhập/Đăng ký: 2 req/giây (Chống Brute-Force mật khẩu)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # 3. Giới hạn số kết nối mở đồng thời của 1 IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Mặc định Nginx trả về 503 khi quá tải -> Ép đổi thành 429 chuẩn tài liệu Quy trình.docx
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        # Header bảo mật cơ bản Lớp 1
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Phản hồi JSON chuẩn khi Nginx chặn lỗi 429 Too Many Requests
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"status": 429, "error": "[Nginx Layer 1 WAF] Phát hiện Spam/DDoS! Tốc độ truy cập vượt quá giới hạn cho phép (HTTP 429)."}';
        }

        # 1. Giao diện Frontend VaultDrive
        location / {
            root /usr/share/nginx/html;
            index index.html login.html;
            try_files $uri $uri/ /index.html =404;
        }

        # 2. Bảo vệ gắt đường dẫn xác thực (/api/auth/)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit_per_ip 10;

            set $backend_upstream http://springboot_app:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Chuyển tiếp các API chung (Cho phép burst=30 để không chặn nhầm Chunked Upload)
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit_per_ip 25;

            set $backend_upstream http://springboot_app:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        

        location /actuator/ {
            set $backend_upstream http://springboot_app:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        # 4. Chuyển tiếp màn hình giám sát Grafana SOC
        location /soc/ {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5 Luồng Upload thư mục/chunk tốc độ cao (Không giới hạn rate hẹp để tránh đứt gãy khi tải 1.500+ file)
        location /api/uploads/ {
            set $backend_upstream http://springboot_app:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}